<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Иллюстрация: серверные стойки и сеть">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26365f"/>
      <stop offset="1" stop-color="#465c8f"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2747"/>
      <stop offset="1" stop-color="#131d36"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".08"/>
    </pattern>
    <g id="unit">
      <rect width="84" height="14" rx="2.5" fill="#22325a" stroke="#3d5286"/>
      <rect x="8" y="5" width="34" height="4" rx="2" fill="#3d5286"/>
      <circle cx="68" cy="7" r="2.2" fill="#3ddc97"/>
      <circle cx="76" cy="7" r="2.2" fill="#e8742a"/>
    </g>
  </defs>
  <rect width="560" height="380" rx="18" fill="url(#bg)"/>
  <rect width="560" height="380" rx="18" fill="url(#dots)"/>

  <!-- линии сети -->
  <g fill="none" stroke="#e8742a" stroke-width="2" opacity=".85">
    <path d="M102 92 C102 50, 250 40, 280 40"/>
    <path d="M222 92 C222 62, 262 52, 280 40"/>
    <path d="M342 92 C342 62, 300 52, 280 40"/>
    <path d="M280 40 C380 40, 430 70, 470 100"/>
    <path d="M470 100 L470 170 M470 100 L520 150"/>
  </g>
  <g fill="#e8742a">
    <circle cx="280" cy="40" r="8"/>
    <circle cx="470" cy="100" r="6"/>
    <circle cx="470" cy="170" r="5"/>
    <circle cx="520" cy="150" r="5"/>
  </g>
  <circle cx="280" cy="40" r="16" fill="none" stroke="#e8742a" opacity=".35"/>

  <!-- стойки -->
  <g transform="translate(60 92)">
    <rect width="84" height="230" rx="6" fill="url(#rack)" stroke="#4a5f93"/>
    <use href="#unit" y="14"/><use href="#unit" y="34"/><use href="#unit" y="54"/>
    <use href="#unit" y="84"/><use href="#unit" y="104"/>
    <use href="#unit" y="140"/><use href="#unit" y="160"/><use href="#unit" y="180"/>
  </g>
  <g transform="translate(180 92)">
    <rect width="84" height="230" rx="6" fill="url(#rack)" stroke="#4a5f93"/>
    <use href="#unit" y="14"/><use href="#unit" y="34"/>
    <use href="#unit" y="64"/><use href="#unit" y="84"/><use href="#unit" y="104"/><use href="#unit" y="124"/>
    <use href="#unit" y="160"/><use href="#unit" y="180"/>
  </g>
  <g transform="translate(300 92)">
    <rect width="84" height="230" rx="6" fill="url(#rack)" stroke="#4a5f93"/>
    <use href="#unit" y="14"/><use href="#unit" y="34"/><use href="#unit" y="54"/><use href="#unit" y="74"/>
    <use href="#unit" y="110"/><use href="#unit" y="130"/>
    <use href="#unit" y="180"/>
  </g>

  <!-- карточка SLA -->
  <g transform="translate(408 214)">
    <rect width="132" height="92" rx="12" fill="#ffffff"/>
    <circle cx="26" cy="28" r="12" fill="#fde7d9"/>
    <path d="M20 28l4.5 4.5L33 24" fill="none" stroke="#e8742a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">SLA 24/7</text>
    <rect x="16" y="54" width="100" height="6" rx="3" fill="#e9edf4"/>
    <rect x="16" y="54" width="78" height="6" rx="3" fill="#3ddc97"/>
    <text x="16" y="80" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5f6b7d">сервис и поддержка</text>
  </g>
  <rect x="40" y="338" width="480" height="2" rx="1" fill="#ffffff" opacity=".12"/>
</svg>
